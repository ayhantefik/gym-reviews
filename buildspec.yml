version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR....
      - aws --version
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 612555043829.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI_CLIENT=612555043829.dkr.ecr.us-east-1.amazonaws.com/gym-reviews-client
      - REPOSITORY_URI_SERVER=612555043829.dkr.ecr.us-east-1.amazonaws.com/gym-reviews-server
      - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')
  build:
    commands:
      - echo Build started on `date`
      - cd client
      - npm install
      - npm run build
      - aws s3 sync dist/ s3://gym-reviews-bucket2 --delete
      - docker build -t $REPOSITORY_URI_CLIENT:latest .
      - docker tag $REPOSITORY_URI_CLIENT:latest $REPOSITORY_URI_CLIENT:$IMAGE_TAG
      - cd ..
      # Server
      - cd server
      - pwd
      - ls -la
      - docker build -t $REPOSITORY_URI_SERVER:latest -t $REPOSITORY_URI_SERVER:$IMAGE_TAG .
      - cd ..
  post_build:
    commands:
      - set -e
      - echo Build completed on `date`
      - echo pushing to repo
      - docker push $REPOSITORY_URI_CLIENT:latest
      - docker push $REPOSITORY_URI_CLIENT:$IMAGE_TAG
      - docker push $REPOSITORY_URI_SERVER:latest
      - docker push $REPOSITORY_URI_SERVER:$IMAGE_TAG
      - echo Writing image definitions file...
      # Container name
      - DOCKER_CONTAINER_NAME_SERVER=gym-reviews-server
      - printf '[{"name":"%s","imageUri":"%s"}]' $DOCKER_CONTAINER_NAME_SERVER $REPOSITORY_URI_SERVER:$IMAGE_TAG > imagedefinitions.json
      - echo $DOCKER_CONTAINER_NAME_SERVER
      - echo printing imagedefinitions.json
      - cat imagedefinitions.json
artifacts:
  base-directory: .
  files:
    - imagedefinitions.json
    