version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR....
      - aws --version
      - aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 368003223163.dkr.ecr.eu-north-1.amazonaws.com
      - REPOSITORY_URI_CLIENT=368003223163.dkr.ecr.eu-north-1.amazonaws.com/gym-reviews-client
      - REPOSITORY_URI_SERVER=368003223163.dkr.ecr.eu-north-1.amazonaws.com/gym-reviews-server
      - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')
  build:
    commands:
      - echo Build started on `date`
      - cd client
      - npm install
      - npm run build
      - aws s3 sync dist/ s3://gym-reviews-bucket --delete
      - docker build -t $REPOSITORY_URI_CLIENT:latest .
      - docker tag $REPOSITORY_URI_CLIENT:latest $REPOSITORY_URI_CLIENT:$IMAGE_TAG
      - cd ..
      - cd server
      - docker build -t $REPOSITORY_URI_SERVER:latest .
      - docker tag $REPOSITORY_URI_SERVER:latest $REPOSITORY_URI_SERVER:$IMAGE_TAG
      - cd ..
  post_build:
    commands:
      - echo Build completed on `date`
      - echo pushing to repo
      - docker push $REPOSITORY_URI_CLIENT:latest
      - docker push $REPOSITORY_URI_CLIENT:$IMAGE_TAG
      - docker push $REPOSITORY_URI_SERVER:latest
      - docker push $REPOSITORY_URI_SERVER:$IMAGE_TAG
      - echo Writing image definitions file...
      # Container name
      - DOCKER_CONTAINER_NAME=gym-reviews
      - printf '[{"name":"%s","imageUri":"%s"}]' $DOCKER_CONTAINER_NAME $REPOSITORY_URI_CLIENT:$IMAGE_TAG \ $REPOSITORY_URI_SERVER:$IMAGE_TAG > imagedefinitions.json
      - echo $DOCKER_CONTAINER_NAME
      - echo printing imagedefinitions.json
      - cat imagedefinitions.json
artifacts:
  base-directory: .
  files:
    - imagedefinitions.json
    